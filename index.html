<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // Run before application resources load so reloads cannot restore an old position.
      const navigationEntry = performance.getEntriesByType('navigation')[0];
      if (navigationEntry && navigationEntry.type === 'reload') {
        history.scrollRestoration = 'manual';
        if (location.hash) history.replaceState(history.state, '', location.pathname + location.search);
        const resetScroll = () => window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        resetScroll();
        window.addEventListener('pageshow', () => {
          resetScroll();
          requestAnimationFrame(resetScroll);
        }, { once: true });
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Finloop 星路科技，为金融机构、数字平台和企业提供财富管理、交易、RWA 与 AI 能力。" />
    <meta name="theme-color" content="#071a2e" />
    <title>Finloop 星路科技 | 机构财富科技平台</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="preload" as="image" href="/assets/home-hero-hong-kong-mobile.webp" media="(max-width: 680px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/home-hero-hong-kong-desktop.webp" media="(min-width: 681px)" fetchpriority="high" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
